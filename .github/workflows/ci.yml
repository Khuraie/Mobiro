name: Mobiro CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  host-core-tests:
    name: C++20 Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure & Build Core Tests
        run: |
          cmake -S app/src/main/cpp -B build-host -DMOBIRO_BUILD_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --parallel
      - name: Run Core Tests
        run: ctest --test-dir build-host --output-on-failure

  android-ndk-build:
    name: Android ARM64 NDK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK & CMake
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Assemble Debug APK (arm64-v8a)
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiro-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
