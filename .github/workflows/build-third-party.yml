name: Build Upstream ARM64 Native Components

on:
  workflow_dispatch:
    inputs:
      build_box64:
        description: "Build upstream Box64 (arm64-v8a)"
        type: boolean
        default: true
      build_turnip:
        description: "Build upstream Mesa Turnip ICD (libvulkan_freedreno.so)"
        type: boolean
        default: true
      build_dxvk:
        description: "Build upstream native AArch64 DXVK (libdxvk_d3d11.so / libdxvk_dxgi.so)"
        type: boolean
        default: true
      assemble_bundled_apk:
        description: "Assemble sideloadable arm64-v8a Debug APK bundling built .so/.a components"
        type: boolean
        default: true
      prebuilt_run_id:
        description: "Optional prior workflow run ID to reuse mobiro-upstream-arm64-libs for fast ~50s APK rebuilds"
        type: string
        default: ""

jobs:
  build-upstream-arm64:
    name: Cross-Compile Upstream Open-Source Binaries (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        if: ${{ inputs.assemble_bundled_apk }}
        with:
          distribution: temurin
          java-version: 17

      - name: Reuse Cached Upstream ARM64 Native Artifacts
        if: ${{ inputs.prebuilt_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: mobiro-upstream-arm64-libs
          run-id: ${{ inputs.prebuilt_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Install NDK & Cross-Build Tools
        run: |
          if [ "${{ inputs.build_box64 }}" = "true" ] || [ "${{ inputs.build_turnip }}" = "true" ] || [ "${{ inputs.build_dxvk }}" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build meson pkg-config bison flex python3-mako python3-yaml glslang-tools
          fi
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch Open-Source Upstream Repos
        if: ${{ inputs.build_box64 || inputs.build_turnip || inputs.build_dxvk }}
        run: bash scripts/fetch_third_party.sh

      - name: Build Box64 (arm64-v8a)
        if: ${{ inputs.build_box64 }}
        run: bash scripts/build_box64_android.sh

      - name: Build Mesa Turnip ICD (arm64-v8a)
        if: ${{ inputs.build_turnip }}
        run: bash scripts/build_turnip_android.sh

      - name: Build Native DXVK (arm64-v8a)
        if: ${{ inputs.build_dxvk }}
        run: bash scripts/build_dxvk_android.sh

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ inputs.assemble_bundled_apk }}
        with:
          gradle-version: 8.10.2

      - name: Cache Stable Android Debug Keystore
        if: ${{ inputs.assemble_bundled_apk }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mobiro-debug-keystore-v1

      - name: Assemble Bundled Debug APK (arm64-v8a)
        if: ${{ inputs.assemble_bundled_apk }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Built ARM64 Native Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobiro-upstream-arm64-libs
          path: |
            third_party/prebuilt/arm64-v8a/**
            app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Bundled ARM64 Debug APK
        if: ${{ inputs.assemble_bundled_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: mobiro-arm64-bundled-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
