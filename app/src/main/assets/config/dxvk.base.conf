# Mobiro Base DXVK Profile — Sekiro: Shadows Die Twice (Adreno + Mesa Turnip)
# Runtime overrides memory caps and compiler thread counts dynamically at launch.

dxvk.enableGraphicsPipelineLibrary = True
dxvk.enableStateCache = True
dxvk.numCompilerThreads = 3
dxvk.maxChunkSize = 64
dxvk.enableMemoryDefrag = True

dxgi.maxDeviceMemory = 4096
dxgi.maxSharedMemory = 2048

d3d11.invariantPosition = True
d3d11.cachedDynamicResources = "vi"
d3d11.relaxedBarriers = False
d3d11.samplerAnisotropy = 8
d3d11.zeroWorkgroupMemory = False
d3d11.maxFrameLatency = 1

dxgi.maxFrameRate = 60
dxgi.syncInterval = 1
dxvk.tearFree = True
